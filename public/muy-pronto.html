<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muy pronto — Washify</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" href="assets/favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  * { box-sizing: border-box; }
  body {
    font-family: 'Hanken Grotesk', sans-serif;
    background: #0D0D0D;
    color: #F5EDE2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap { text-align: center; max-width: 480px; }
  .logo { width: 180px; max-width: 60vw; margin-bottom: 40px; }
  h1 { font-size: 34px; font-weight: 900; margin: 0 0 14px; }
  p { font-size: 16px; font-weight: 500; color: #B8B4AC; margin: 0 0 36px; line-height: 1.5; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #7DA5ED;
    color: #0D0D0D;
    font-size: 16px;
    font-weight: 800;
    padding: 16px 36px;
    border-radius: 999px;
    text-decoration: none;
    transition: transform 0.2s;
  }
  .btn:hover { transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="assets/Washify_Logo-Light.png" alt="Washify">
    <h1>Muy pronto</h1>
    <p>Estamos terminando los últimos detalles. En breve vas a poder acceder desde acá.</p>
    <a class="btn" href="/">Volver</a>
  </div>
</body>
</html>
